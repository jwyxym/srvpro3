[package]
name = "srvpro3"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio.workspace = true
anyhow.workspace = true

srvpro3-init.workspace = true

[workspace.dependencies]
sea-orm = { version = "2.0", features = [
	"sqlx-sqlite",
	"sqlx-postgres",
	"sqlx-mysql",
	"runtime-tokio-rustls",
	"macros"
] }
tokio = { version = "1", features = ["full"] }
parking_lot = { version = "0.12.5", features = ["arc_lock", "send_guard"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22"
chrono = "0.4.45"
anyhow = "1.0.104"
basic-toml = "0.1.10"
log = "0.4.34"
simple_logger = "5.2.0"
axum = { version = "0.8.9", features = ["ws"] }
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }
binrw = "0.13"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.29"
tokio_kcp = "0.9.8"
linkme = "0.3"
zip = "0.6"
walkdir = "2.5.0"
regex = "1.11.2"
lazy_static = "1.5.0"
sysinfo = "0.37.2"
indexmap = { version = "2.13.0", features = ["serde"] }
libloading = "0.9.0"
ygopro-derive = "0.1.1"
ygopro = { version = "0.1.5", default-features = false, features = ["koishi", "forge"] }
ygopro-data = { version = "0.1.1", default-features = false }
ygopro-core-wrapper = { version = "0.1.3", default-features = false, features = ["koishi"] }
ygopro-handler = "0.1.2"
ygopro_cdb_reader = "0.1.5"

srvpro3-cards = { path = "./crates/srvpro3-cards" }
srvpro3-config = { path = "./crates/srvpro3-config" }
srvpro3-database = { path = "./crates/srvpro3-database" }
srvpro3-deck = { path = "./crates/srvpro3-deck" }
srvpro3-http = { path = "./crates/srvpro3-http" }
srvpro3-init = { path = "./crates/srvpro3-init" }
srvpro3-log = { path = "./crates/srvpro3-log" }
srvpro3-server = { path = "./crates/srvpro3-server" }
srvpro3-windbot = { path = "./crates/srvpro3-windbot" }

[workspace]
resolver = "2"
members = [
	"crates/srvpro3-cards",
	"crates/srvpro3-config",
	"crates/srvpro3-database",
	"crates/srvpro3-deck",
	"crates/srvpro3-http",
	"crates/srvpro3-init",
	"crates/srvpro3-log",
	"crates/srvpro3-server",
	"crates/srvpro3-windbot"
]
