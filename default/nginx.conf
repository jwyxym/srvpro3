# srvpro3 反向代理示例
# 假设 nginx 与 srvpro3 位于同一主机；端口对应 config.toml：
#   [http_api] port = 8080
#   [server.ws] port = 7912

map $http_upgrade $srvpro3_connection_upgrade {
    default upgrade;
    ''      close;
}

# 游戏客户端连接 /ws，不携带管理接口的 auth 查询参数。
# WebUI 同样连接 /ws，但携带 auth，转发到 HTTP 服务进行鉴权。
# 必须保留原始路径和查询参数：管理接口的加密鉴权绑定了请求目标。
map $arg_auth $srvpro3_ws_backend {
    ''      127.0.0.1:7912;
    default 127.0.0.1:8080;
}

server {
    listen 80;
    server_name localhost; # 替换为实际域名

    # 本地可用 http://localhost；远程 WebUI 的公钥鉴权需要 HTTPS。
    # 对公网部署时，将上面的 listen 80 改成以下 TLS 配置，
    # 并另建一个 80 端口 server，将 HTTP 重定向到 HTTPS。
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # 管理请求可能携带较长的加密 auth 查询参数。
    large_client_header_buffers 4 16k;
    client_max_body_size 96m;

    # 不将含 auth 的请求 URL 写入访问日志。
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $srvpro3_connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;

    # 游戏：ws://localhost/ws；启用 TLS 后为 wss://你的域名/ws。
    # 带 auth 的 WebUI 实时连接由上面的 map 分流到 8080。
    location = /ws {
        proxy_pass http://$srvpro3_ws_backend;
    }

    # WebUI 静态资源、HTTP API、录像下载全部交给 srvpro3。
    # 不添加路径前缀，也不重写 URI，以保留鉴权所需的原始请求目标。
    # 录像接口返回 application/gzip，由前端解压；不要额外设置 Content-Encoding。
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

# TCP 7911、KCP/UDP 7913 不经过上述 HTTP 反向代理。
